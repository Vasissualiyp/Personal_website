{{ define "main" }}
<div id="body">
	<div class="header">
		<div>
			<h1>{{ .Title }}</h1>
			<p class="meta">
				<span class="date">{{ .Date.Format "January 2, 2006" }}</span>
				{{ with .Params.author }}
				<span class="author">by {{ . }}</span>
				{{ end }}
			</p>
			{{ with .Params.tags }}
			<p class="tags">
				Tags: 
				{{ range . }}
				<span class="tag">{{ . }}</span>
				{{ end }}
			</p>
			{{ end }}
		</div>
	</div>
	
	<div class="body">
		<div class="article-content">
			{{ .Content }}
		</div>
	</div>
	
	<div class="footer">
		<div>
			<p><a href="{{ .Section | absURL }}">&larr; Back to {{ .Section | title }} Blog</a></p>
		</div>
	</div>
</div>

<style>
.meta {
	color: #888;
	font-size: 0.9em;
	margin: 1em 0;
}

.meta .date {
	margin-right: 1em;
}

.tags {
	margin: 1em 0;
}

.tag {
	background: #e0e0e0;
	padding: 0.3em 0.6em;
	margin-right: 0.5em;
	border-radius: 3px;
	font-size: 0.85em;
}

.article-content {
	line-height: 1.8;
	max-width: 800px;
	margin: 2em auto;
}

.article-content h1,
.article-content h2,
.article-content h3 {
	margin-top: 1.5em;
	margin-bottom: 0.5em;
}

.article-content code {
	background: #f4f4f4;
	padding: 0.2em 0.4em;
	border-radius: 3px;
	font-family: 'Courier New', monospace;
	font-size: 0.9em;
}

.article-content pre {
	background: #f4f4f4;
	padding: 1em;
	border-radius: 5px;
	overflow-x: auto;
	border-left: 3px solid #333;
}

.article-content pre code {
	background: none;
	padding: 0;
}

.article-content ul,
.article-content ol {
	margin-left: 2em;
	line-height: 1.8;
}

.article-content blockquote {
	border-left: 3px solid #ccc;
	padding-left: 1em;
	margin-left: 0;
	color: #666;
	font-style: italic;
}
</style>
{{ end }}
